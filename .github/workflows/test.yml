name: Test

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest app/modules/patients/tests -q --cov=app --cov-report=term-missing

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medvoice
          POSTGRES_PASSWORD: medvoice
          POSTGRES_DB: medvoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medvoice -d medvoice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://medvoice:medvoice@localhost:5432/medvoice_test
      TEST_DATABASE_URL: postgresql+asyncpg://medvoice:medvoice@localhost:5432/medvoice_test
      JWT_SECRET_KEY: ci-test-jwt-secret-key-minimum-length-32
      APP_ENV: test
      DEBUG: "false"
      CORS_ORIGINS: http://testserver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests with coverage
        run: >
          pytest tests/integration -m integration -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medvoice
          POSTGRES_PASSWORD: medvoice
          POSTGRES_DB: medvoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medvoice -d medvoice_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://medvoice:medvoice@localhost:5432/medvoice_test
      JWT_SECRET_KEY: ci-test-jwt-secret-key-minimum-length-32
      APP_ENV: test
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:5173
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Bootstrap database
        run: |
          alembic upgrade head
          python -m app.db.seed
        working-directory: backend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

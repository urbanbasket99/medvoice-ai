[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app"]
markers = [
    "integration: integration tests requiring PostgreSQL",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/**/tests/*",
    "app/db/seed.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0

[tool.coverage.html]
directory = "htmlcov"
